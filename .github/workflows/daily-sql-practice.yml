name: Daily SQL Practice

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '37 13 * * *'
    - cron: '7 14 * * *'

permissions:
  contents: write

jobs:
  daily-sql:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create daily SQL practice
        run: |
          set -e
          git pull --rebase origin main
          mkdir -p daily
          DAY=$(date -u +%Y-%m-%d)
          TIME=$(date -u +%H%M)
          FILE="daily/sql-${DAY}-${TIME}-${GITHUB_RUN_ID}.sql"
          cat > "$FILE" <<'SQL'
          -- Daily SQL Practice
          -- Topic: Window Functions
          
          WITH ranked_products AS (
              SELECT
                  product_id,
                  category,
                  price,
                  RANK() OVER (
                      PARTITION BY category
                      ORDER BY price DESC
                  ) AS price_rank
              FROM products
          )
          SELECT
              product_id,
              category,
              price,
              price_rank
          FROM ranked_products
          WHERE price_rank <= 3
          ORDER BY category, price_rank;
          SQL
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "chore: add daily SQL practice ${DAY}-${TIME}-${GITHUB_RUN_ID}"
          git push origin HEAD:main
